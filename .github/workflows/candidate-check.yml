name: Candidate check

# A build not released yet, on Windows, before its release: the checks of channel-checks.yml, the
# gem's with the build in the gem's place. Started by hand.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "The private checks' release that holds the build to test"
        required: true

permissions: {}

jobs:
  rubygems-windows:
    name: RubyGems on Windows with the build (Ruby ${{ matrix.ruby }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, ruby: "4.0" }
          - { runner: windows-2022, ruby: "3.2" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Fetch the private checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: marqiushq/windows
          token: ${{ secrets.CHECKS_TOKEN }}
          persist-credentials: false
      - name: Fetch the build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CHECKS_TOKEN }}
          CANDIDATE: ${{ inputs.candidate }}
        run: gh release download "$env:CANDIDATE" -R marqiushq/windows -p marqius-wkhtmltopdf.exe -D candidate
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install from RubyGems, put the build in the gem's place, and use it
        shell: pwsh
        run: ./test/gem.ps1 -Out out -Web -Build candidate/marqius-wkhtmltopdf.exe

  program-windows:
    name: The build on Windows (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Fetch the private checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: marqiushq/windows
          token: ${{ secrets.CHECKS_TOKEN }}
          persist-credentials: false
      - name: Fetch the build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CHECKS_TOKEN }}
          CANDIDATE: ${{ inputs.candidate }}
        run: gh release download "$env:CANDIDATE" -R marqiushq/windows -p marqius-wkhtmltopdf.exe -D candidate
      - name: Use it as applications do
        shell: pwsh
        run: ./test/smoke.ps1 -Exe candidate/marqius-wkhtmltopdf.exe -Out out -Names -Web
